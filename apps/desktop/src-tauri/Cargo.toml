# The desktop app. It is its own workspace, so the main workspace keeps
# building and testing on machines without WebKit.
[workspace]

[package]
name = "desktop"
version = "1.0.0"
edition = "2021"
license = "FSL-1.1-ALv2"
publish = false

[lib]
name = "desktop"
path = "src/lib.rs"

[[bin]]
name = "desktop"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
brand = { path = "../../../crates/brand" }
proto = { path = "../../../crates/proto" }
hoststate = { path = "../../../crates/hoststate" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", default-features = false, features = ["socket", "signal"] }

[dev-dependencies]
daemon = { path = "../../../crates/daemon" }
engine = { path = "../../../crates/engine" }
secrets = { path = "../../../crates/secrets" }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
