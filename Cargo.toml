[workspace]
resolver = "2"
members = [
    "crates/brand",
    "crates/projectcheck",
    "crates/gitbroker",
    "crates/secrets",
    "crates/egress",
    "crates/engine",
    "crates/proto",
    "crates/hoststate",
    "crates/daemon",
    "crates/cli",
]
# The desktop app is its own workspace, because it needs WebKit to build and
# the rest must still build and test without it.
exclude = ["apps"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
brand = { path = "crates/brand" }
projectcheck = { path = "crates/projectcheck" }
gitbroker = { path = "crates/gitbroker" }
secrets = { path = "crates/secrets" }
egress = { path = "crates/egress" }
engine = { path = "crates/engine" }
proto = { path = "crates/proto" }
hoststate = { path = "crates/hoststate" }
daemon = { path = "crates/daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
zeroize = "1"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "forbid"
