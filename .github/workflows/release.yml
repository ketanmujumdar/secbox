# Builds, signs and notarizes a macOS release, publishes it on GitHub, and
# updates the Homebrew tap. Runs when a tag like v1.0.0 is pushed.
#
# One-time setup (secrets, certificate, tap repository) is in docs/RELEASING.md.
# Until the secrets exist, the signing step fails before anything is published.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the tag matches every version
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          grep -q "^version = \"$v\"$" Cargo.toml \
            || { echo "Cargo.toml [workspace.package] version is not $v"; exit 1; }
          grep -q "\"version\": \"$v\"" apps/desktop/src-tauri/tauri.conf.json \
            || { echo "tauri.conf.json version is not $v"; exit 1; }

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "secret for $name is not set; see docs/RELEASING.md"; exit 1; }
          done
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(openssl rand -hex 24)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_API_KEY_P8" ] || { echo "APPLE_API_KEY_P8 is not set"; exit 1; }
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build the CLI and daemon
        run: cargo build --release --locked -p cli -p daemon --bins

      - name: Sign and notarize the CLI and daemon
        run: |
          set -euo pipefail
          mkdir -p dist/cli
          for bin in secbox secboxd; do
            cp "target/release/$bin" dist/cli/
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "dist/cli/$bin"
            codesign --verify --strict --verbose=2 "dist/cli/$bin"
          done
          # Bare executables can't be stapled. Notarizing them still lets
          # Gatekeeper accept them online if a quarantine flag is ever set.
          ditto -c -k dist/cli dist/cli.zip
          xcrun notarytool submit dist/cli.zip --wait \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
          tar -czf "dist/secbox-$VERSION-darwin-aarch64.tar.gz" -C dist/cli secbox secboxd
          rm dist/cli.zip

      - name: Build, sign and notarize the desktop app
        run: |
          set -euo pipefail
          apps/desktop/scripts/prepare-sidecars.sh
          cargo install tauri-cli --version '^2' --locked
          # Tauri signs the app and its sidecars with APPLE_SIGNING_IDENTITY,
          # and notarizes and staples the .app with the API key variables.
          (cd apps/desktop/src-tauri && cargo tauri build --bundles app,dmg)
          dmg="$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)"
          cp "$dmg" "dist/secbox-desktop-$VERSION-aarch64.dmg"
          dmg="dist/secbox-desktop-$VERSION-aarch64.dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --wait \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Smoke test what was built
        run: |
          set -euo pipefail
          ./dist/cli/secbox --version | grep -F "$VERSION"
          ./dist/cli/secbox doctor || true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "secbox-$VERSION-darwin-aarch64.tar.gz" "secbox-desktop-$VERSION-aarch64.dmg" > SHA256SUMS
          cat SHA256SUMS
          # Every 0.x release is marked as a pre-release.
          pre=()
          case "$VERSION" in 0.*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" ${pre[@]+"${pre[@]}"} --verify-tag --generate-notes \
            --title "secbox $VERSION" \
            "secbox-$VERSION-darwin-aarch64.tar.gz" "secbox-desktop-$VERSION-aarch64.dmg" SHA256SUMS

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so the tap was not updated."
            echo "Run scripts/render-homebrew.sh by hand; see docs/RELEASING.md."
            exit 0
          fi
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ketanmujumdar/homebrew-tap.git" "$tap"
          scripts/render-homebrew.sh "$VERSION" \
            "dist/secbox-$VERSION-darwin-aarch64.tar.gz" \
            "dist/secbox-desktop-$VERSION-aarch64.dmg" "$tap"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/secbox.rb Casks/secbox-desktop.rb
          git commit -m "secbox $VERSION"
          git push origin HEAD

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
