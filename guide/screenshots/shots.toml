# Every screenshot in the documentation, made by capture.py from the real
# programs. To add one, add a [[shot]] here and run:
#
#   guide/screenshots/capture.py            # all of them
#   guide/screenshots/capture.py check-risky
#
# Fields:
#   name     file name: guide/src/images/cli/<name>.png
#   args     arguments to `secbox`, run from the repository root
#   title    the caption shown in the gallery
#   group    which gallery section it goes under
#   cols     terminal width (default 130, or 100 for the full-screen interface)
#   rows     terminal height, for the full-screen interface only
#   daemon   true if it needs secboxd running (started for you, with no engine)
#   input    text typed into the command after it starts, such as an answer
#   keys     for the full-screen interface: keys to press, in order, before
#            the screen is captured
#   host_details  true if the output shows the machine it ran on: its OS version,
#            CPUs, memory or disk. capture.py skips these unless told otherwise.
#
# Each run uses a fresh state folder at /tmp/secbox-demo, so nothing touches
# your real ~/.secbox or keychain.

[[shot]]
name = "help"
args = ["--help"]
cols = 140
title = "secbox --help: every command"
group = "Getting started"

[[shot]]
name = "doctor"
args = ["doctor"]
title = "secbox doctor: what this machine can run"
group = "Getting started"
host_details = true

[[shot]]
name = "check-risky"
args = ["check", "tests/fixtures/risky"]
title = "secbox check on a risky Compose project"
group = "Checking a project"
rows = 70

